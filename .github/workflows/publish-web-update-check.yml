name: Publish @loomantix/web-update-check

on:
  push:
    tags:
      - 'web-update-check-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-web-update-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
          scope: '@loomantix'

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/web-update-check-v')
        working-directory: packages/web-update-check
        run: |
          tag_version="${GITHUB_REF_NAME#web-update-check-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version ($tag_version) does not match package.json ($pkg_version)"
            exit 1
          fi
          echo "Publishing @loomantix/web-update-check@$pkg_version"

      - run: pnpm --filter @loomantix/web-update-check typecheck
      - run: pnpm --filter @loomantix/web-update-check test
      - run: pnpm --filter @loomantix/web-update-check build

      - name: Publish
        working-directory: packages/web-update-check
        run: pnpm publish --access public --provenance --no-git-checks
