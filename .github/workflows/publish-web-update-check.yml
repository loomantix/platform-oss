name: Publish @loomantix/web-update-check

on:
  push:
    tags:
      - 'web-update-check-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-web-update-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # A tag-triggered run executes the workflow definition from the tagged ref,
    # so every check below can be deleted by the same commit that pushes the
    # tag. The environment's protection rules live in repository settings,
    # outside the ref's reach, and are what actually gates the publish; scope
    # the npm Trusted Publisher to this environment so the gate is unavoidable.
    environment: npm-publish
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
          scope: '@loomantix'

      # --ignore-scripts is explicit, not incidental: this job holds
      # id-token: write, so a dependency lifecycle script here could mint an npm
      # token or rewrite dist/ before the publish step. pnpm 10 blocks unlisted
      # build scripts by default, but that default is one allowlist entry away
      # from being reversed.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify tag matches package.json version
        working-directory: packages/web-update-check
        run: |
          tag_version="${GITHUB_REF_NAME#web-update-check-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version ($tag_version) does not match package.json ($pkg_version)"
            exit 1
          fi
          echo "Publishing @loomantix/web-update-check@$pkg_version"

      - run: pnpm --filter @loomantix/web-update-check typecheck
      - run: pnpm --filter @loomantix/web-update-check test
      - run: pnpm --filter @loomantix/web-update-check build

      # pnpm is required: the package's resolvable entry points come from
      # publishConfig.main/types/exports, which npm publish does not apply.
      - name: Publish
        working-directory: packages/web-update-check
        run: pnpm publish --access public --provenance --no-git-checks
