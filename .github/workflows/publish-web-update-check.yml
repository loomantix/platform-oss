name: Publish @loomantix/web-update-check

on:
  push:
    tags:
      - 'web-update-check-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-web-update-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
          scope: '@loomantix'

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        working-directory: packages/web-update-check
        run: |
          tag_version="${GITHUB_REF_NAME#web-update-check-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version ($tag_version) does not match package.json ($pkg_version)"
            exit 1
          fi
          echo "Publishing @loomantix/web-update-check@$pkg_version"

      - name: Verify tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - run: pnpm --filter @loomantix/web-update-check typecheck
      - run: pnpm --filter @loomantix/web-update-check test
      - run: pnpm --filter @loomantix/web-update-check build

      - name: Publish
        working-directory: packages/web-update-check
        run: pnpm publish --access public --provenance --no-git-checks
