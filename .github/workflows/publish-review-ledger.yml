name: Publish @loomantix/review-ledger

on:
  push:
    tags:
      - 'review-ledger-v*'

permissions:
  contents: read

# This workflow asserts an exact npm CLI version, so it pins Node to the exact
# patch that ships it rather than tracking `.nvmrc` like every other workflow
# here. Both jobs must stay on the same pair. See RELEASING.md.
env:
  RELEASE_NODE_VERSION: 24.18.0
  RELEASE_NPM_VERSION: 11.16.0

concurrency:
  group: publish-review-ledger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify tag matches package.json version
        working-directory: packages/review-ledger
        run: |
          tag_version="${GITHUB_REF_NAME#review-ledger-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version ($tag_version) does not match package.json ($pkg_version)"
            exit 1
          fi
          echo "Preparing @loomantix/review-ledger@$pkg_version"

      - run: pnpm --filter @loomantix/review-ledger typecheck
      - run: pnpm --filter @loomantix/review-ledger test
      - run: pnpm --filter @loomantix/review-ledger build

      - name: Vendorable bundle reports its real version
        # A `define` that silently stopped applying would ship a bundle
        # reporting `0.0.0-dev`, and the engine repos pin their vendored copy
        # by exactly this output. Fail the build instead.
        working-directory: packages/review-ledger
        run: |
          set -euo pipefail
          expected="$(node -p "require('./package.json').version")"
          actual="$(node dist/review-ledger.bundle.js --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::bundle reports version $actual, package.json says $expected"
            exit 1
          fi
          [ "$(node dist/review-ledger.bundle.js --protocol-version)" = 3 ]

      - name: Pack publish artifact
        run: |
          mkdir -p "$RUNNER_TEMP/review-ledger-package"
          pnpm --filter @loomantix/review-ledger pack \
            --pack-destination "$RUNNER_TEMP/review-ledger-package"

      - name: Verify signed release and seal the artifact
        env:
          RELEASE_SIGNER: 8B680106EACC77AA538529E61E2DF3CE6E27C317
        run: |
          set -euo pipefail
          test "$(npm --version)" = "$RELEASE_NPM_VERSION"
          command -v node npm python3 git gpg openssl
          node --version
          git --version
          gpg --version
          openssl version
          curl --fail --silent --show-error --location --proto '=https' \
            https://github.com/BaxterDevs.gpg -o "$RUNNER_TEMP/release-signer.asc"
          gpg --batch --import "$RUNNER_TEMP/release-signer.asc"
          curl --fail --silent --show-error --location --proto '=https' \
            https://raw.githubusercontent.com/loomantix/activeloom/64a44bb0ad03ecddbc07eb2abdfc4e1ea46be2ae/.codex/skills/publish-npm-package/scripts/release-preflight.py \
            -o "$RUNNER_TEMP/release-preflight.py"
          echo "5f80ee73e181bf664374b4583c388f1a75d36572a7888204b6e51bacacf0c93c  $RUNNER_TEMP/release-preflight.py" | sha256sum --check --strict
          set -- "$RUNNER_TEMP"/review-ledger-package/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected exactly one package tarball"
            exit 1
          fi
          python3 "$RUNNER_TEMP/release-preflight.py" \
            --package-dir packages/review-ledger --artifact "$1" \
            --tag "$GITHUB_REF_NAME" --phase publish --access public \
            --signer-fingerprint "$RELEASE_SIGNER" \
            --output "$RUNNER_TEMP/review-ledger-package/preflight.json"
          cd "$RUNNER_TEMP/review-ledger-package"
          sha256sum ./*.tgz preflight.json > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-ledger-package
          path: ${{ runner.temp }}/review-ledger-package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Stage for independent npm approval
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # A tag-triggered run executes the workflow definition from the tagged ref.
    # The environment's protection rules live in repository settings, outside
    # the ref's reach, and are what actually gate publication; scope the npm
    # Trusted Publisher to this environment so the gate is unavoidable.
    environment: npm-publish
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-ledger-package
          path: package
      # registry-url writes token auth config that masks Trusted Publisher OIDC (actions/setup-node#1551).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false

      - name: Stage the verified tarball
        run: |
          set -euo pipefail
          test "$(npm --version)" = "$RELEASE_NPM_VERSION"
          cd package
          sha256sum --check --strict SHA256SUMS
          set -- ./*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected exactly one package tarball"
            exit 1
          fi
          npm stage publish "$1" --registry=https://registry.npmjs.org --access public --provenance --ignore-scripts
