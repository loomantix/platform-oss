name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run typecheck

  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - name: Verify web-update-check publish artifact
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/package/package
        run: |
          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$package_dir"
          pnpm --filter @loomantix/web-update-check pack \
            --pack-destination "$package_dir"

          cd "$RUNNER_TEMP"
          set -- ./package/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected exactly one package tarball"
            exit 1
          fi

          tar -xzf "$1" -C "$package_dir"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const manifest = JSON.parse(
            readFileSync(join(process.env.PACKAGE_ROOT, 'package.json'), 'utf8'),
          );
          const entries = {
            main: manifest.main,
            types: manifest.types,
            defaultExport: manifest.exports?.['.']?.default,
            defaultTypes: manifest.exports?.['.']?.types,
            viteExport: manifest.exports?.['./vite']?.default,
            viteTypes: manifest.exports?.['./vite']?.types,
          };
          const expected = {
            main: './dist/index.js',
            types: './dist/index.d.ts',
            defaultExport: './dist/index.js',
            defaultTypes: './dist/index.d.ts',
            viteExport: './dist/vite.js',
            viteTypes: './dist/vite.d.ts',
          };

          for (const [name, expectedPath] of Object.entries(expected)) {
            if (entries[name] !== expectedPath) {
              throw new Error(`${name} is ${String(entries[name])}, expected ${expectedPath}`);
            }
            if (!existsSync(join(process.env.PACKAGE_ROOT, expectedPath))) {
              throw new Error(`${name} target is missing: ${expectedPath}`);
            }
          }
          NODE
          # This job must never publish, and today it cannot: it sets no
          # registry-url, no NODE_AUTH_TOKEN, and no id-token: write, so a real
          # publish fails ENEEDAUTH. Keep it that way — that credential absence
          # is the actual guard, and --dry-run is the local, reviewable one.
          # Publication belongs to publish-web-update-check.yml, which gates on
          # the npm-publish environment and adds the tag-on-main and
          # tag/version checks, the pinned registry, and the provenance signing
          # that this line has none of.
          #
          # Tolerate only the already-published-version conflict. Passing
          # --force to swallow it would also disable npm's
          # prerelease-needs-a-tag and implicit-latest guards and skip the
          # registry lookup entirely, leaving a step that verifies nothing the
          # assertions above have not already checked.
          if ! publish_output=$(npm publish "$1" --access public --dry-run --ignore-scripts 2>&1); then
            printf '%s\n' "$publish_output"
            case "$publish_output" in
              *"cannot publish over the previously published versions"*)
                echo "::notice::Version already published; artifact checks passed."
                ;;
              *)
                exit 1
                ;;
            esac
          else
            printf '%s\n' "$publish_output"
          fi

      - name: Verify review-ledger publish artifact
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/review-ledger-package/package
        run: |
          package_dir="$RUNNER_TEMP/review-ledger-package"
          mkdir -p "$package_dir"
          pnpm --filter @loomantix/review-ledger pack \
            --pack-destination "$package_dir"

          cd "$RUNNER_TEMP"
          set -- ./review-ledger-package/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected exactly one package tarball"
            exit 1
          fi

          tar -xzf "$1" -C "$package_dir"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const manifest = JSON.parse(
            readFileSync(join(process.env.PACKAGE_ROOT, 'package.json'), 'utf8'),
          );
          const entries = {
            main: manifest.main,
            types: manifest.types,
            bin: manifest.bin?.['review-ledger'],
            defaultExport: manifest.exports?.['.']?.default,
            defaultTypes: manifest.exports?.['.']?.types,
            importExport: manifest.exports?.['.']?.import,
            requireExport: manifest.exports?.['.']?.require,
          };
          const expected = {
            main: './dist/index.js',
            types: './dist/index.d.ts',
            bin: './dist/bin.js',
            defaultExport: './dist/index.js',
            defaultTypes: './dist/index.d.ts',
            importExport: './dist/index.js',
            requireExport: './dist/index.cjs',
          };

          for (const [name, expectedPath] of Object.entries(expected)) {
            if (entries[name] !== expectedPath) {
              throw new Error(`${name} is ${String(entries[name])}, expected ${expectedPath}`);
            }
            if (!existsSync(join(process.env.PACKAGE_ROOT, expectedPath))) {
              throw new Error(`${name} target is missing: ${expectedPath}`);
            }
          }
          NODE

          tarball="$(realpath "$1")"
          smoke_dir="$RUNNER_TEMP/review-ledger-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          npm init --yes >/dev/null
          npm install "$tarball" --ignore-scripts --no-audit --no-fund
          node --input-type=module --eval "import('@loomantix/review-ledger').then((pkg) => { if (pkg.PROTOCOL_VERSION !== 3 || 'setGitHubRunner' in pkg) process.exit(1); })"
          node --eval "const pkg = require('@loomantix/review-ledger'); if (pkg.PROTOCOL_VERSION !== 3 || 'setGitHubRunner' in pkg) process.exit(1)"
          test "$(./node_modules/.bin/review-ledger --protocol-version)" = "3"

          if ! publish_output=$(npm publish "$tarball" --access public --dry-run --ignore-scripts 2>&1); then
            printf '%s\n' "$publish_output"
            case "$publish_output" in
              *"cannot publish over the previously published versions"*)
                echo "::notice::Version already published; artifact checks passed."
                ;;
              *)
                exit 1
                ;;
            esac
          else
            printf '%s\n' "$publish_output"
          fi
