name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run typecheck

  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - name: Verify web-update-check publish artifact
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/package/package
        run: |
          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$package_dir"
          pnpm --filter @loomantix/web-update-check pack \
            --pack-destination "$package_dir"

          cd "$RUNNER_TEMP"
          set -- ./package/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected exactly one package tarball"
            exit 1
          fi

          tar -xzf "$1" -C "$package_dir"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const manifest = JSON.parse(
            readFileSync(join(process.env.PACKAGE_ROOT, 'package.json'), 'utf8'),
          );
          const entries = {
            main: manifest.main,
            types: manifest.types,
            defaultExport: manifest.exports?.['.']?.default,
            defaultTypes: manifest.exports?.['.']?.types,
            viteExport: manifest.exports?.['./vite']?.default,
            viteTypes: manifest.exports?.['./vite']?.types,
          };
          const expected = {
            main: './dist/index.js',
            types: './dist/index.d.ts',
            defaultExport: './dist/index.js',
            defaultTypes: './dist/index.d.ts',
            viteExport: './dist/vite.js',
            viteTypes: './dist/vite.d.ts',
          };

          for (const [name, expectedPath] of Object.entries(expected)) {
            if (entries[name] !== expectedPath) {
              throw new Error(`${name} is ${String(entries[name])}, expected ${expectedPath}`);
            }
            if (!existsSync(join(process.env.PACKAGE_ROOT, expectedPath))) {
              throw new Error(`${name} target is missing: ${expectedPath}`);
            }
          }
          NODE
          # --dry-run is what keeps this a verification step: without it this line
          # would really publish the tarball from CI, bypassing
          # publish-web-update-check.yml's tag check, pinned registry, and
          # provenance signing. Nothing enforces that, so never separate the two.
          # --force is only here so the check can still run once the current
          # version is on the registry.
          npm publish "$1" --access public --dry-run --ignore-scripts --force
